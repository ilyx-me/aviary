name: test-bootstrap
on:
  push:
    branches: []
  pull_request:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: configure ssh key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AVIARY_SECRETS_TEST_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/knownhosts
      - name: run test default
        run: nix run -L .#checks.x86_64-linux.bootstrap.driver
